# nginx site for the Applier API. Copy to /etc/nginx/sites-enabled/applier-api on the droplet, then run
#   certbot --nginx -d api.applier.site
# Certbot adds the HTTPS (port 443) part and the redirect for you, the same way it did for your other sites.
server {
    listen 80;
    listen [::]:80;
    server_name api.applier.site;

    client_max_body_size 6m;          # resume uploads are limited to 5 MB

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;      # AI requests can take a while
    }
}
